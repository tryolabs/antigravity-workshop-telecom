[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "telecom-nexus-workshop"
version = "2.0.0"
description = "Google Antigravity Telecom Industry Workshop: 5G Network Slice SLA, CDR Revenue Assurance & B2B Contract Intelligence Platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.6.0",
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "mcp>=1.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v --tb=short"
